<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Space | Free Premium Retro Gaming</title>
    <style>
        :root {
            --bg-primary: #08080c;
            --bg-sidebar: #0f0f16;
            --bg-card: #141420;
            --accent-glow: #b042ff;
            --accent-pink: #fa2c7b;
            --text-main: #ffffff;
            --text-muted: #8b8b9f;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid #1f1f2e;
            display: flex;
            flex-direction: column;
            padding: 25px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 35px;
            background: linear-gradient(90deg, var(--accent-glow), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0 0 30px 0;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: #d1d1e0;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            background-color: var(--bg-card);
            color: var(--text-main);
        }

        .main-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .main-header {
            margin-bottom: 35px;
        }

        .catalog-title h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
            font-weight: 800;
        }

        .catalog-title p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .arcade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        .game-card {
            position: relative;
            background-color: var(--bg-card);
            border: 1px solid #1f1f30;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 2 / 3;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-glow);
            box-shadow: 0 12px 30px rgba(176, 66, 255, 0.25);
        }

        .card-artwork {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a29;
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(8,8,12,0.95) 30%, rgba(0,0,0,0.2) 100%);
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
            box-sizing: border-box;
        }

        .platform-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(8, 8, 12, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            font-size: 9px;
            font-weight: 800;
            border-radius: 4px;
            color: var(--accent-pink);
            z-index: 3;
        }

        .game-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 4px 0;
        }

        .game-genre {
            font-size: 11px;
            color: var(--text-muted);
            margin: 0;
        }

        .stage-view {
            display: none;
            width: 100%;
        }

        .stage-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .back-btn {
            background: var(--bg-card);
            border: 1px solid #222235;
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .back-btn:hover {
            background: var(--accent-pink);
            border-color: var(--accent-pink);
        }

        .emulator-viewport {
            width: 100%;
            max-width: 960px;
            height: 580px;
            background: #000000;
            border: 1px solid #1f1f30;
            border-radius: 16px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand-logo">Arcade Space</div>
        <div class="nav-section-title">Discover</div>
        <ul class="nav-links">
            <li class="nav-item" onclick="showCatalog()">🏠 All Games</li>
        </ul>
    </aside>

    <main class="main-content">
        <div id="catalogModule">
            <div class="main-header">
                <div class="catalog-title">
                    <h1>Active Retro Library</h1>
                    <p>Instant browser emulation. No advertisements. No memberships.</p>
                </div>
            </div>

            <div class="arcade-grid">
                <div class="game-card" onclick="launchEngine('https://emulatorjs.org', 'Retro Hub Launcher')">
                    <div class="platform-tag">GAMEBOY</div>
                    <div class="card-artwork" style="background-image: url('https://unsplash.com');"></div>
                    <div class="card-overlay">
                        <h3 class="game-title">GBA System Engine</h3>
                        <p class="game-genre">Multisystem Player</p>
                    </div>
                </div>

                <div class="game-card" onclick="launchEngine('https://gitlab.io', 'Burrito Bison: Revenge')">
                    <div class="platform-tag">ARCADE</div>
                    <div class="card-artwork" style="background-image: url('https://unsplash.com');"></div>
                    <div class="card-overlay">
                        <h3 class="game-title">Burrito Bison</h3>
                        <p class="game-genre">Launch / Arcade</p>
                    </div>
                </div>

                <div class="game-card" onclick="launchEngine('https://github.io', 'Retro Bowl Ultimate')">
                    <div class="platform-tag">SPORTS</div>
                    <div class="card-artwork" style="background-image: url('https://unsplash.com');"></div>
                    <div class="card-overlay">
                        <h3 class="game-title">Retro Bowl</h3>
                        <p class="game-genre">Pixel Football</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="stageModule" class="stage-view">
            <div class="stage-header">
                <button class="back-btn" onclick="showCatalog()">← Return to Library</button>
                <h1 id="activeGameTitle" style="margin:0; font-size:24px;">Running Subsystem...</h1>
            </div>
            <div class="emulator-viewport">
                <iframe id="viewFrame" src=""></iframe>
            </div>
        </div>
    </main>

    <script>
        function launchEngine(targetUrl, gameName) {
            document.getElementById('catalogModule').style.display = 'none';
            document.getElementById('stageModule').style.display = 'block';
            document.getElementById('activeGameTitle').innerText = gameName;
            document.getElementById('viewFrame').src = targetUrl;
        }

        function showCatalog() {
            document.getElementById('catalogModule').style.display = 'block';
            document.getElementById('stageModule').style.display = 'none';
            document.getElementById('viewFrame').src = '';
        }
    </script>
</body>
</html>
